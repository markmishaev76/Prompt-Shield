name: AI Harness Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: markmishaev76/ai-harness-scorecard@v1
        id: scorecard
      # main is protected by a ruleset that rejects direct pushes
      - name: Open PR with badge and report
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            scorecard-badge.json
            scorecard-report.md
          branch: chore/scorecard-update
          delete-branch: true
          commit-message: "chore: update scorecard badge and report"
          title: "chore: update scorecard badge and report"
          body: Automated update from the AI Harness Scorecard workflow.
